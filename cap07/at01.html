<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWEB1 — Cap. 07 — AT01 — Cartão de Apresentação</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    .cartao {
      background-color: white;
      border-radius: 10px;
      padding: 2rem;
      width: 300px;
      margin: 30px auto;
      border: 1px solid #ccc;
    }

    .cartao-nome {
      font-size: 2rem;
      font-weight: bold;
      color: #1a4d8f;
      margin-bottom: 10px;
    }

    hr {
      width: 80%;
    }

    .cartao-divisor {
      border: 2px dashed #1a4d8f;
    }

    .cartao-cargo {
      font-style: italic;
      color: #555;
    }

    .cartao-email {
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cartão de Apresentação</h1>
    <p><a href="../index.html"> Voltar para a página principal</a></p>
  </header>

  <main>
    <article class="cartao">
      <h1 class="cartao-nome">Matheus Luna</h1>
      <hr class="cartao-divisor">

      <p class="cartao-cargo">
        Estudante de Sistemas de Informação — IFAL
      </p>

      <p class="cartao-email">
        matheus@email.com
      </p>
    </article>
  </main>

</body>
</html>
